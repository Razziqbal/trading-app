// ─── MATHS ───────────────────────────────────────────────────────────────────
function calcEMA(prices, period) {
  if (prices.length < period) return prices.map(() => null);
  const k = 2 / (period + 1);
  const out = new Array(period - 1).fill(null);
  out.push(prices.slice(0, period).reduce((a, b) => a + b, 0) / period);
  for (let i = period; i < prices.length; i++)
    out.push(prices[i] * k + out[out.length - 1] * (1 - k));
  return out;
}
function calcATR(hi, lo, cl, p = 14) {
  const tr = [hi[0] - lo[0]];
  for (let i = 1; i < cl.length; i++)
    tr.push(Math.max(hi[i]-lo[i], Math.abs(hi[i]-cl[i-1]), Math.abs(lo[i]-cl[i-1])));
  const out = new Array(p - 1).fill(null);
  let atr = tr.slice(0, p).reduce((a,b)=>a+b,0)/p;
  out.push(atr);
  for (let i = p; i < tr.length; i++) { atr=(atr*(p-1)+tr[i])/p; out.push(atr); }
  return out;
}
function runBacktest(data, e9, e15, atrs, cap=10000) {
  const trades=[]; let capital=cap, peak=cap, maxDD=0, pos=null;
  for (let i=1; i<data.length; i++) {
    if (e9[i]==null||e15[i]==null||atrs[i]==null) continue;
    const price=data[i].close;
    const crossUp  = e9[i]>e15[i]  && e9[i-1]!=null && e9[i-1]<=(e15[i-1]??e9[i-1]);
    const crossDown = e9[i]<e15[i] && e9[i-1]!=null && e9[i-1]>=(e15[i-1]??e9[i-1]);
    if (pos) {
      const hitSL=data[i].low<=pos.sl, hitTP=data[i].high>=pos.tp;
      if (hitSL||hitTP||crossDown) {
        const ep=hitSL?pos.sl:hitTP?pos.tp:price;
        const pnl=(ep-pos.entry)*pos.units;
        capital+=pnl; if(capital>peak) peak=capital;
        const dd=((peak-capital)/peak)*100; if(dd>maxDD) maxDD=dd;
        trades.push({id:trades.length+1,entryDate:pos.entryDate,exitDate:data[i].date,
          entry:pos.entry,exit:ep,sl:pos.sl,tp:pos.tp,pnl:+pnl.toFixed(2),
          pnlPct:+((ep-pos.entry)/pos.entry*100).toFixed(3),
          result:pnl>=0?"WIN":"LOSS",reason:hitSL?"Stop Loss":hitTP?"Take Profit":"Signal Exit"});
        pos=null;
      }
    }
    if (!pos&&crossUp&&capital>0) {
      const sl=+(price-atrs[i]*1.5).toFixed(5), tp=+(price+atrs[i]*3).toFixed(5);
      const units=+(capital*0.95/price).toFixed(4);
      if(units>0) pos={entryDate:data[i].date,entry:price,units,sl,tp};
    }
  }
  return {trades,finalCapital:+capital.toFixed(2),maxDrawdown:+maxDD.toFixed(2)};
}

// ─── PAIR UTILS ──────────────────────────────────────────────────────────────
const FX_CCY = ["AUD","CAD","CHF","CNY","CZK","DKK","EUR","GBP","HKD","HUF","IDR","ILS","INR","JPY","KRW","MXN","MYR","NOK","NZD","PHP","PLN","RON","SEK","SGD","THB","TRY","TWD","USD","ZAR","XAU","XAG","XPT","XPD"];
function isForexPair(sym) {
  const s = sym.toUpperCase().replace(/[^A-Z]/g,"");
  if (s.length!==6) return false;
  return FX_CCY.includes(s.slice(0,3)) && FX_CCY.includes(s.slice(3,6));
}
function displaySym(sym) {
  const s=sym.toUpperCase().replace(/[^A-Z0-9]/g,"");
  return isForexPair(s) ? `${s.slice(0,3)}/${s.slice(3)}` : s;
}
function pairDecimals(sym) {
  const s=sym.toUpperCase();
  if (s.includes("JPY")) return 3;
  if (s.includes("XAU")||s.includes("XAG")||s.includes("OIL")||s.includes("XTI")) return 2;
  return 5;
}
const fmt = (n,d)=>n!=null?parseFloat(n).toFixed(d??4):"—";
const fmtUSD = n=>n!=null?`$${parseFloat(n).toFixed(2)}`:"—";
const fmtPct = n=>n!=null?`${n>0?"+":""}${parseFloat(n).toFixed(2)}%`:"—";
const timeAgo = s=>s<60?`${s}s ago`:s<3600?`${Math.floor(s/60)}m ago`:`${Math.floor(s/3600)}h ago`;

// ─── API ──────────────────────────────────────────────────────────────────────
// Aggregate ascending hourly bars into 4-hour candles aligned to 0/4/8/12/16/20.
// open = first bar's open, high = max, low = min, close = last bar's close.
function aggregate4h(bars) {
  const groups = new Map();
  for (const b of bars) {
    const m = b.date.match(/(\d{4}-\d{2}-\d{2})[ T](\d{2}):/);
    let key, label;
    if (m) {
      const bucket = Math.floor(parseInt(m[2],10)/4)*4;
      const hh = String(bucket).padStart(2,"0");
      key = `${m[1]} ${hh}`;
      label = `${m[1]} ${hh}:00:00`;
    } else { key = b.date; label = b.date; }
    if (!groups.has(key)) groups.set(key, {date:label, open:b.open, high:b.high, low:b.low, close:b.close});
    else {
      const g = groups.get(key);
      g.high = Math.max(g.high, b.high);
      g.low  = Math.min(g.low,  b.low);
      g.close = b.close;
    }
  }
  return Array.from(groups.values());
}

async function fetchPriceData(sym, ivl, apiKey) {
  const s = sym.toUpperCase().replace(/[^A-Z0-9]/g,"");
  const isFx = isForexPair(s);
  const apiIvl = ivl==="4h" ? "60min" : ivl;   // 4h is built by aggregating hourly bars
  const isDaily = apiIvl==="daily";
  let url, hint;
  if (isFx) {
    const from=s.slice(0,3), to=s.slice(3,6);
    url = isDaily
      ? `https://www.alphavantage.co/query?function=FX_DAILY&from_symbol=${from}&to_symbol=${to}&outputsize=full&apikey=${apiKey}`
      : `https://www.alphavantage.co/query?function=FX_INTRADAY&from_symbol=${from}&to_symbol=${to}&interval=${apiIvl}&outputsize=full&apikey=${apiKey}`;
    hint = isDaily ? "Time Series FX (Daily)" : `Time Series FX (${apiIvl})`;
  } else {
    url = isDaily
      ? `https://www.alphavantage.co/query?function=TIME_SERIES_DAILY&symbol=${s}&outputsize=full&apikey=${apiKey}`
      : `https://www.alphavantage.co/query?function=TIME_SERIES_INTRADAY&symbol=${s}&interval=${apiIvl}&outputsize=full&apikey=${apiKey}`;
    hint = isDaily ? "Time Series (Daily)" : `Time Series (${apiIvl})`;
  }

  let resp;
  try { resp = await fetch(url); }
  catch(e) { throw new Error("Network request failed. If you opened this file directly, try serving it locally instead (see instructions). ("+e.message+")"); }
  if (!resp.ok) throw new Error(`Server returned ${resp.status}. Try again shortly.`);

  let json;
  try { json = await resp.json(); }
  catch(e) { throw new Error("Invalid response from Alpha Vantage."); }

  if (json["Error Message"]) throw new Error(`Invalid symbol "${s}". Check the pair (e.g. EURUSD, XAUUSD).`);
  if (json["Note"]) throw new Error("Rate limit reached — free tier is 25 calls/day, 5/min. Wait a minute.");
  if (json["Information"]) throw new Error("Rate limit / key issue: "+json["Information"]);

  const tsKey = Object.keys(json).find(k => k.toLowerCase().includes("time series"));
  if (!tsKey) throw new Error(`No price data. Response keys: [${Object.keys(json).join(", ")}]. Expected "${hint}".`);

  const entries = Object.entries(json[tsKey]).sort(([a],[b])=>new Date(a)-new Date(b));
  if (entries.length < 20) throw new Error(`Only ${entries.length} candles returned. Try Daily interval first.`);

  let mapped = entries.map(([date,v])=>({
    date, open:+v["1. open"], high:+v["2. high"], low:+v["3. low"], close:+v["4. close"],
  }));
  if (ivl==="4h") mapped = aggregate4h(mapped);

  const maxBars = ivl==="5min"?78:ivl==="15min"?390:ivl==="30min"?240:ivl==="4h"?150:apiIvl==="60min"?480:130;
  return mapped.slice(-maxBars);
}

// ─── CONSTANTS ───────────────────────────────────────────────────────────────
const DEFAULT_WATCHLIST = {

};
const INTERVALS = [
  { key:"daily", label:"Daily",  note:"~6 months" },
  { key:"4h",    label:"4 hr",   note:"~1 month · built from hourly" },

  { key:"15min", label:"15 min", note:"~5 days" },

];

const SIG_STYLE = {
  BUY:       {label:"BUY",    color:"#10B981",bg:"#052E16",border:"#10B98150"},
  SELL:      {label:"SELL",   color:"#EF4444",bg:"#450A0A",border:"#EF444450"},
  HOLD_BULL: {label:"HOLD ↑", color:"#F59E0B",bg:"#1C1208",border:"#F59E0B50"},

};

// ─── SVG CHART (no external chart lib — bulletproof) ─────────────────────────
function PriceChart({ data, dec, intraday }) {
  const W = 920, H = 320, padL = 64, padR = 16, padT = 14, padB = 28;
  const plotW = W - padL - padR, plotH = H - padT - padB;
  const vals = [];
  data.forEach(d => { vals.push(d.close); if(d.ema9!=null)vals.push(d.ema9); if(d.ema15!=null)vals.push(d.ema15); });
  const min = Math.min(...vals), max = Math.max(...vals);
  const range = (max-min)||1;
  const x = i => padL + (i/(data.length-1))*plotW;
  const y = v => padT + (1-(v-min)/range)*plotH;
  const path = key => data.map((d,i)=> d[key]==null?null:`${x(i).toFixed(1)},${y(d[key]).toFixed(1)}`)
    .filter(Boolean).reduce((s,p,i)=> s + (i===0?`M${p}`:`L${p}`), "");
  const yTicks = 5;
  const tickVals = Array.from({length:yTicks+1}, (_,i)=> min + (range*i/yTicks));
  const xStep = Math.max(1, Math.floor(data.length/7));

  return (
    <svg viewBox={`0 0 ${W} ${H}`} style={{width:"100%",height:"auto",display:"block"}}>
      {tickVals.map((tv,i)=>(
        <g key={i}>
          <line x1={padL} y1={y(tv)} x2={W-padR} y2={y(tv)} stroke="#1E293B" strokeWidth="1" strokeDasharray="3 3"/>
          <text x={padL-8} y={y(tv)+3} fill="#475569" fontSize="9" textAnchor="end" fontFamily="monospace">{tv.toFixed(dec>3?dec-2:dec)}</text>
        </g>
      ))}
      {data.map((d,i)=> i%xStep===0 ? (
        <text key={i} x={x(i)} y={H-8} fill="#475569" fontSize="9" textAnchor="middle" fontFamily="monospace">{intraday ? (d.date?.slice(5,16).replace(" ","·")) : d.date?.slice(5,10)}</text>
      ) : null)}
      <path d={path("close")} fill="none" stroke="#2563EB" strokeWidth="1" opacity="0.5"/>
      <path d={path("ema9")}  fill="none" stroke="#3B82F6" strokeWidth="2"/>
      <path d={path("ema15")} fill="none" stroke="#A78BFA" strokeWidth="2"/>
    </svg>
  );
}

function StatCard({label,value,color,sub}) {
  return (
    <div style={{background:"#0F172A",border:"1px solid #1E293B",borderRadius:10,padding:"12px 16px",flex:1,minWidth:100}}>
      <div style={{color:"#64748B",fontSize:10,textTransform:"uppercase",letterSpacing:"0.08em",marginBottom:5}}>{label}</div>
      <div style={{color:color||"#E2E8F0",fontSize:19,fontWeight:700,fontFamily:"monospace"}}>{value}</div>
      {sub&&<div style={{color:"#475569",fontSize:11,marginTop:2}}>{sub}</div>}
    </div>
  );
}

// ─── MAIN ─────────────────────────────────────────────────────────────────────
function EMATrader() {
  const [keyInput, setKeyInput] = useState("");
  const [keySaved, setKeySaved] = useState(false);
  const savedKeyRef = useRef("");

  const [marketTab, setMarketTab] = useState("forex");
  const [watchlist, setWatchlist] = useState(DEFAULT_WATCHLIST);
  const [pairInput, setPairInput] = useState("");
  const [active, setActive] = useState(null);
  const [ivl, setIvl] = useState("daily");
  const [refresh, setRefresh] = useState(0);
  const [countdown, setCountdown] = useState(0);
  const [callCount, setCallCount] = useState(0);

  const [loading, setLoading] = useState(false);
  const [error, setError] = useState("");
  const [chartData, setChartData] = useState([]);
  const [signal, setSignal] = useState(null);
  const [backtest, setBacktest] = useState(null);
  const [lastFetch, setLastFetch] = useState(null);
  const [elapsed, setElapsed] = useState(0);
  const [tab, setTab] = useState("chart");
  const [tradeFilter, setTradeFilter] = useState("ALL");
  const [mtfOn, setMtfOn] = useState(true);      // 4h trend filter on/off
  const [trend4h, setTrend4h] = useState(null);  // {dir:"bull"|"bear", ema9, ema15, date}

  const timerRef=useRef(null), elapsedR=useRef(null), cdR=useRef(null), ivlRef=useRef(ivl);
  const mtfRef=useRef(mtfOn);
  useEffect(()=>{ ivlRef.current=ivl; },[ivl]);
  useEffect(()=>{ mtfRef.current=mtfOn; },[mtfOn]);

  // Timeframes below 4h, where a 4h trend filter is meaningful
  const SUB_4H = ["5min","15min","30min","60min"];

  const saveKey = () => {
    const k = keyInput.trim();
    if (!k) return;
    savedKeyRef.current = k;
    setKeySaved(true);
  };

  const doFetch = useCallback(async (sym, interval) => {
    const key = savedKeyRef.current;
    if (!key) { setError("No API key saved. Enter your key and click Save Key."); return; }
    if (!sym) { setError("No pair selected."); return; }
    setLoading(true); setError("");
    try {
      const raw = await fetchPriceData(sym, interval, key);
      setCallCount(c=>c+1);
      const closes=raw.map(d=>d.close), highs=raw.map(d=>d.high), lows=raw.map(d=>d.low);
      const e9=calcEMA(closes,9), e15=calcEMA(closes,15), atrs=calcATR(highs,lows,closes,14);
      const dec=pairDecimals(sym);
      const combined=raw.map((d,i)=>({...d,sym,ema9:e9[i]!=null?+e9[i].toFixed(dec+2):null,ema15:e15[i]!=null?+e15[i].toFixed(dec+2):null}));
      setChartData(combined);
      const li=combined.length-1, cur=combined[li], prv=combined[li-1], atr=atrs[li]??0;
      let sigType;
      if (cur.ema9>cur.ema15&&prv?.ema9!=null&&prv.ema9<=(prv?.ema15??prv.ema9)) sigType="BUY";
      else if (cur.ema9<cur.ema15&&prv?.ema9!=null&&prv.ema9>=(prv?.ema15??prv.ema9)) sigType="SELL";
      else sigType=cur.ema9>cur.ema15?"HOLD_BULL":"HOLD_BEAR";
      setSignal({type:sigType,sym,price:cur.close,ema9:cur.ema9,ema15:cur.ema15,
        tp:+(cur.close+atr*3).toFixed(dec+2),sl:+(cur.close-atr*1.5).toFixed(dec+2),
        atr:+atr.toFixed(dec+2),date:cur.date,dec});
      const bt=runBacktest(combined,e9,e15,atrs);
      const wins=bt.trades.filter(t=>t.result==="WIN").length, losses=bt.trades.length-wins;
      const avgW=bt.trades.filter(t=>t.result==="WIN").reduce((s,t)=>s+t.pnlPct,0)/(wins||1);
      const avgL=bt.trades.filter(t=>t.result==="LOSS").reduce((s,t)=>s+t.pnlPct,0)/(losses||1);
      setBacktest({...bt,wins,losses,total:bt.trades.length,
        winRate:bt.trades.length?((wins/bt.trades.length)*100).toFixed(1):"0",
        totalRet:(((bt.finalCapital-10000)/10000)*100).toFixed(2),
        avgWin:+avgW.toFixed(2),avgLoss:+avgL.toFixed(2)});
      setLastFetch(Date.now()); setElapsed(0);

      // ── 4h trend filter (second call, only on sub-4h timeframes) ──
      if (mtfRef.current && SUB_4H.includes(interval)) {
        try {
          const raw4h = await fetchPriceData(sym, "4h", key);
          setCallCount(c=>c+1);
          const cl4 = raw4h.map(d=>d.close);
          const e9_4 = calcEMA(cl4,9), e15_4 = calcEMA(cl4,15);
          const j = cl4.length-1;
          if (e9_4[j]!=null && e15_4[j]!=null) {
            setTrend4h({
              dir: e9_4[j] > e15_4[j] ? "bull" : "bear",
              ema9: e9_4[j], ema15: e15_4[j], date: raw4h[j].date,
            });
          } else setTrend4h(null);
        } catch(e) {
          setTrend4h({ error: e.message });   // show a soft note, don't fail the main load
        }
      } else {
        setTrend4h(null);
      }
    } catch(e) { setError(e.message); }
    finally { setLoading(false); }
  }, []);

  useEffect(()=>{
    clearInterval(elapsedR.current);
    if (!lastFetch) return;
    elapsedR.current=setInterval(()=>setElapsed(Math.floor((Date.now()-lastFetch)/1000)),1000);
    return ()=>clearInterval(elapsedR.current);
  },[lastFetch]);
  useEffect(()=>{
    clearInterval(timerRef.current); clearInterval(cdR.current);
    if (refresh===0||!active){setCountdown(0);return;}
    setCountdown(refresh);
    cdR.current=setInterval(()=>setCountdown(c=>c<=1?refresh:c-1),1000);
    timerRef.current=setInterval(()=>doFetch(active,ivlRef.current),refresh*1000);
    return ()=>{clearInterval(timerRef.current);clearInterval(cdR.current);};
  },[refresh,active,doFetch]);

  const switchPair = (sym, interval) => {
    if (!savedKeyRef.current) { setError("Enter and Save your API key first."); return; }
    setActive(sym); setTab("chart"); setSignal(null); setChartData([]); setBacktest(null); setError("");
    doFetch(sym, interval||ivl);
  };
  const changeInterval = (n) => { setIvl(n); if(active&&savedKeyRef.current) doFetch(active,n); };
  const addPair = () => {
    const t=pairInput.trim().toUpperCase().replace(/[^A-Z0-9]/g,"");
    if (!t) return;
    const mkt=isForexPair(t)?(["XAU","XAG","XPT","XPD"].some(m=>t.startsWith(m))?"metals":"forex"):"stocks";
    setWatchlist(w=>({...w,[mkt]:w[mkt].includes(t)?w[mkt]:[...w[mkt],t]}));
    setMarketTab(mkt); setPairInput(""); switchPair(t,ivl);
  };
  const removePair = (sym,mkt,e)=>{
    e.stopPropagation();
    setWatchlist(w=>({...w,[mkt]:w[mkt].filter(x=>x!==sym)}));
    if(active===sym){setActive(null);setSignal(null);setChartData([]);setBacktest(null);}
  };

  const sigStyle = signal?SIG_STYLE[signal.type]:null;
  const dec = signal?.dec??4;
  const filtered = backtest?.trades.filter(t=>tradeFilter==="ALL"||t.result===tradeFilter)??[];

  return (
    <div style={{minHeight:"100vh",background:"#060B18",fontFamily:"'Inter',system-ui,sans-serif",color:"#E2E8F0",display:"flex",flexDirection:"column"}}>
      <div style={{background:"#0A1020",borderBottom:"1px solid #1E293B",padding:"12px 20px",display:"flex",alignItems:"center",gap:16,flexWrap:"wrap"}}>
        <div>
          <div style={{display:"flex",alignItems:"center",gap:6,marginBottom:2}}>
            <div style={{width:7,height:7,borderRadius:"50%",background:keySaved?"#10B981":"#F59E0B",boxShadow:keySaved?"0 0 6px #10B981":"0 0 6px #F59E0B"}}/>
            <span style={{fontFamily:"monospace",color:keySaved?"#10B981":"#F59E0B",fontSize:10,letterSpacing:"0.15em"}}>{keySaved?"CONNECTED · ALPHA VANTAGE":"AWAITING API KEY"}</span>
          </div>
          <div style={{fontSize:17,fontWeight:800,color:"#F1F5F9"}}>9 / 15 EMA · Forex &amp; Commodities</div>
        </div>
        <div style={{marginLeft:"auto",display:"flex",alignItems:"center",gap:8,flexWrap:"wrap"}}>
          {!keySaved ? (
            <React.Fragment>
              <input value={keyInput} onChange={e=>setKeyInput(e.target.value)} onKeyDown={e=>e.key==="Enter"&&saveKey()}
                placeholder="Paste Alpha Vantage API key" type="password"
                style={{padding:"7px 12px",background:"#111827",border:"1px solid #374151",borderRadius:7,color:"#E2E8F0",fontSize:13,width:250,outline:"none"}}/>
              <button onClick={saveKey} style={{padding:"7px 16px",background:"#1D4ED8",border:"none",borderRadius:7,color:"#fff",fontSize:13,fontWeight:600,cursor:"pointer"}}>Save Key</button>
              <a href="https://www.alphavantage.co/support/#api-key" target="_blank" rel="noreferrer" style={{color:"#3B82F6",fontSize:12}}>Get free key →</a>
            </React.Fragment>
          ) : (
            <div style={{display:"flex",alignItems:"center",gap:10}}>
              <span style={{color:"#10B981",fontSize:12,fontWeight:600}}>✓ Key saved</span>
              <button onClick={()=>{setKeySaved(false);setKeyInput("");savedKeyRef.current="";}} style={{padding:"4px 10px",background:"transparent",border:"1px solid #1E293B",borderRadius:5,color:"#64748B",fontSize:11,cursor:"pointer"}}>Change</button>
              <span style={{color:"#334155",fontSize:12,fontFamily:"monospace"}}>{callCount}/25 calls used</span>
            </div>
          )}
        </div>
      </div>

      <div style={{display:"flex",flex:1,overflow:"hidden"}}>
        <div style={{width:172,background:"#0A1020",borderRight:"1px solid #1E293B",display:"flex",flexDirection:"column",padding:"14px 10px",gap:4,flexShrink:0,overflowY:"auto"}}>
          <div style={{display:"flex",gap:3,marginBottom:8}}>
            {Object.entries(MARKET_INFO).map(([k,m])=>(
              <button key={k} onClick={()=>setMarketTab(k)} style={{flex:1,padding:"4px 0",borderRadius:5,border:"1px solid",borderColor:marketTab===k?m.color+"60":"#1E293B",background:marketTab===k?m.color+"18":"transparent",color:marketTab===k?m.color:"#475569",fontSize:9,fontWeight:700,cursor:"pointer"}}>{m.label}</button>
            ))}
          </div>
          <div style={{color:"#334155",fontSize:10,marginBottom:8}}>{MARKET_INFO[marketTab].hint}</div>
          {watchlist[marketTab].map(sym=>(
            <div key={sym} onClick={()=>switchPair(sym,ivl)} style={{padding:"8px 10px",borderRadius:7,border:"1px solid",borderColor:active===sym?"#1D4ED8":"#1E293B",background:active===sym?"#1E3A5F":"#0F172A",cursor:"pointer",display:"flex",alignItems:"center",justifyContent:"space-between",opacity:keySaved?1:0.45}}>
              <div>
                <div style={{fontFamily:"monospace",fontWeight:700,fontSize:13,color:active===sym?"#93C5FD":"#E2E8F0"}}>{displaySym(sym)}</div>
                {active===sym&&signal?.type&&<div style={{fontSize:9,color:SIG_STYLE[signal.type]?.color,marginTop:1}}>{SIG_STYLE[signal.type]?.label}</div>}
              </div>
              <span onClick={e=>removePair(sym,marketTab,e)} style={{color:"#334155",fontSize:15,cursor:"pointer",padding:"0 2px"}}>×</span>
            </div>
          ))}
          <div style={{marginTop:6,display:"flex",gap:3}}>
            <input value={pairInput} onChange={e=>setPairInput(e.target.value.toUpperCase())} onKeyDown={e=>e.key==="Enter"&&addPair()} placeholder="+ EURUSD…"
              style={{flex:1,padding:"6px 7px",background:"#060B18",border:"1px dashed #1E293B",borderRadius:5,color:"#E2E8F0",fontSize:11,fontFamily:"monospace",outline:"none",minWidth:0}}/>
            <button onClick={addPair} style={{padding:"6px 10px",background:"#1E293B",border:"none",borderRadius:5,color:"#93C5FD",fontSize:15,cursor:"pointer"}}>+</button>
          </div>
          <div style={{marginTop:"auto",paddingTop:12,borderTop:"1px solid #1E293B"}}>
            <div style={{color:"#475569",fontSize:9,textTransform:"uppercase",letterSpacing:"0.12em",marginBottom:6}}>Candle Interval</div>
            {INTERVALS.map(i=>(
              <div key={i.key} onClick={()=>changeInterval(i.key)} style={{padding:"5px 8px",borderRadius:5,marginBottom:2,cursor:"pointer",background:ivl===i.key?"#1E3A5F":"transparent",color:ivl===i.key?"#93C5FD":"#64748B",fontSize:12,display:"flex",justifyContent:"space-between",alignItems:"center"}}>
                <span>{i.label}</span>{ivl===i.key&&<span style={{fontSize:9,color:"#475569"}}>{i.note}</span>}
              </div>
            ))}
          </div>
        </div>

        <div style={{flex:1,overflow:"auto",padding:18}}>
          {error&&<div style={{background:"#450A0A",border:"1px solid #7F1D1D",borderRadius:8,padding:"12px 16px",color:"#FCA5A5",marginBottom:14,fontSize:13,lineHeight:1.5}}>⚠ {error}</div>}

          {active&&(
            <div style={{display:"flex",alignItems:"center",gap:10,marginBottom:14,flexWrap:"wrap"}}>
              <div style={{fontFamily:"monospace",fontSize:17,fontWeight:800,color:"#F1F5F9"}}>{displaySym(active)}<span style={{color:"#334155",fontSize:12,fontWeight:400,marginLeft:8}}>{INTERVALS.find(i=>i.key===ivl)?.label}</span></div>
              {lastFetch&&!loading&&<div style={{color:"#475569",fontSize:12}}>Updated {timeAgo(elapsed)}{refresh>0&&<span style={{color:"#334155"}}> · next in {countdown}s</span>}</div>}
              <div style={{marginLeft:"auto",display:"flex",alignItems:"center",gap:6,flexWrap:"wrap"}}>
                {SUB_4H.includes(ivl)&&(
                  <button onClick={()=>{ const n=!mtfOn; setMtfOn(n); mtfRef.current=n; if(active&&savedKeyRef.current) doFetch(active,ivl); }}
                    title="Fetch the 4h trend alongside this timeframe (uses a 2nd API call)"
                    style={{padding:"4px 10px",borderRadius:5,border:"1px solid",borderColor:mtfOn?"#A78BFA60":"#1E293B",background:mtfOn?"#A78BFA18":"#0F172A",color:mtfOn?"#C4B5FD":"#64748B",fontSize:11,cursor:"pointer",fontWeight:600}}>
                    4h filter: {mtfOn?"On":"Off"}
                  </button>
                )}
                <span style={{color:"#64748B",fontSize:11}}>Auto-refresh:</span>
                {REFRESH_OPTS.map(r=>(
                  <button key={r.key} onClick={()=>setRefresh(r.key)} style={{padding:"4px 9px",borderRadius:5,border:"1px solid",borderColor:refresh===r.key?"#1D4ED8":"#1E293B",background:refresh===r.key?"#1E3A5F":"#0F172A",color:refresh===r.key?"#93C5FD":"#64748B",fontSize:11,cursor:"pointer",fontWeight:refresh===r.key?600:400}}>{r.label}</button>
                ))}
                <button onClick={()=>doFetch(active,ivl)} disabled={loading||!keySaved} style={{padding:"5px 14px",background:loading||!keySaved?"#1E293B":"#1D4ED8",border:"none",borderRadius:6,color:"#fff",fontSize:12,fontWeight:600,cursor:loading||!keySaved?"not-allowed":"pointer"}}>{loading?"Loading…":"↻ Refresh"}</button>
              </div>
            </div>
          )}

          {active&&ivl!=="daily"&&<div style={{background:"#1C1208",border:"1px solid #F59E0B30",borderRadius:7,padding:"8px 12px",marginBottom:12,fontSize:11,color:"#D97706"}}>⚡ {INTERVALS.find(i=>i.key===ivl)?.label} candles = {(mtfOn&&SUB_4H.includes(ivl))?"2 API calls":"1 API call"} per refresh{(mtfOn&&SUB_4H.includes(ivl))?" (1 for this timeframe + 1 for the 4h filter)":""}. Free tier: 25/day, 5/min.</div>}

          {loading&&<div style={{textAlign:"center",padding:"50px 20px"}}><div style={{fontFamily:"monospace",color:"#3B82F6",fontSize:13}}>Fetching {displaySym(active||"")} · {INTERVALS.find(i=>i.key===ivl)?.label}…</div></div>}

          {!loading&&!active&&(
            <div style={{textAlign:"center",padding:"60px 20px",color:"#334155"}}>
              <div style={{fontSize:40,marginBottom:14}}>💱</div>
              {!keySaved ? (
                <React.Fragment>
                  <div style={{fontSize:16,fontWeight:600,color:"#475569",marginBottom:8}}>Step 1: Save your API key above</div>
                  <div style={{fontSize:13,color:"#334155",marginBottom:6}}>Free key at alphavantage.co — 30 seconds.</div>
                  <div style={{fontSize:12,color:"#1E3A5F"}}>Free tier: 25 calls/day · 5 calls/min</div>
                </React.Fragment>
              ) : (
                <React.Fragment>
                  <div style={{fontSize:16,fontWeight:600,color:"#475569",marginBottom:8}}>Step 2: Pick a pair from the sidebar</div>
                  <div style={{display:"flex",gap:8,justifyContent:"center",marginTop:12,flexWrap:"wrap"}}>
                    {["XAUUSD","GBPUSD","EURUSD","GBPJPY"].map(s=>(
                      <div key={s} onClick={()=>switchPair(s,ivl)} style={{padding:"6px 14px",background:"#0F172A",border:"1px solid #1E293B",borderRadius:20,cursor:"pointer",fontFamily:"monospace",fontSize:12,color:"#64748B"}}>{displaySym(s)}</div>
                    ))}
                  </div>
                </React.Fragment>
              )}
            </div>
          )}

          {!loading&&signal&&sigStyle&&(
            <React.Fragment>
              <div style={{display:"flex",gap:10,marginBottom:12,flexWrap:"wrap"}}>
                <div style={{background:sigStyle.bg,border:`1px solid ${sigStyle.border}`,borderRadius:12,padding:"14px 20px",minWidth:140,flexShrink:0}}>
                  <div style={{color:"#64748B",fontSize:10,textTransform:"uppercase",letterSpacing:"0.1em",marginBottom:5}}>Signal</div>
                  <div style={{color:sigStyle.color,fontSize:30,fontWeight:900,fontFamily:"monospace"}}>{sigStyle.label}</div>
                  <div style={{color:"#475569",fontSize:10,marginTop:3}}>{signal.date?.slice(0,16)}</div>
                </div>
                <StatCard label="Price" value={fmt(signal.price,dec)}/>
                <StatCard label="EMA 9" value={fmt(signal.ema9,dec)} color="#3B82F6" sub="Fast"/>
                <StatCard label="EMA 15" value={fmt(signal.ema15,dec)} color="#A78BFA" sub="Slow"/>
                <div style={{background:"#0F172A",border:"1px solid #1E293B",borderRadius:10,padding:"12px 16px",flex:1,minWidth:140}}>
                  <div style={{color:"#64748B",fontSize:10,textTransform:"uppercase",letterSpacing:"0.08em",marginBottom:8}}>Take Profit / Stop Loss</div>
                  <div style={{display:"flex",justifyContent:"space-between",marginBottom:6}}><span style={{color:"#10B981",fontSize:12,fontWeight:600}}>▲ TP</span><span style={{color:"#10B981",fontFamily:"monospace",fontSize:14,fontWeight:700}}>{fmt(signal.tp,dec)}</span></div>
                  <div style={{display:"flex",justifyContent:"space-between"}}><span style={{color:"#EF4444",fontSize:12,fontWeight:600}}>▼ SL</span><span style={{color:"#EF4444",fontFamily:"monospace",fontSize:14,fontWeight:700}}>{fmt(signal.sl,dec)}</span></div>
                  <div style={{color:"#334155",fontSize:10,marginTop:5}}>ATR: {fmt(signal.atr,dec)} · 1:2 R:R</div>
                </div>
              </div>

              {SUB_4H.includes(ivl)&&mtfOn&&trend4h&&(()=>{
                if (trend4h.error) return (
                  <div style={{background:"#0F172A",border:"1px solid #1E293B",borderRadius:8,padding:"10px 14px",marginBottom:12,fontSize:12,color:"#64748B"}}>
                    4h trend filter unavailable: {trend4h.error}
                  </div>
                );
                const mainBull = signal.type==="BUY"||signal.type==="HOLD_BULL";
                const trendBull = trend4h.dir==="bull";
                const aligned = mainBull===trendBull;
                const isCross = signal.type==="BUY"||signal.type==="SELL";
                const trendColor = trendBull?"#10B981":"#EF4444";
                const barColor = aligned?"#10B981":"#EF4444";
                const barBg = aligned?"#052E16":"#450A0A";
                const trendWord = trendBull?"uptrend":"downtrend";
                let verdict;
                if (isCross && aligned)       verdict = `✓ ${sigStyle.label} agrees with the 4h ${trendWord} — higher-probability setup`;
                else if (isCross && !aligned) verdict = `✗ ${sigStyle.label} is against the 4h ${trendWord} — most traders would skip this one`;
                else if (aligned)             verdict = `Holding · the 4h ${trendWord} supports the current bias`;
                else                          verdict = `Holding · current bias conflicts with the 4h ${trendWord}`;
                return (
                  <div style={{background:barBg,border:`1px solid ${barColor}40`,borderRadius:8,padding:"10px 14px",marginBottom:12,display:"flex",alignItems:"center",gap:14,flexWrap:"wrap"}}>
                    <div style={{display:"flex",flexDirection:"column",gap:2,paddingRight:14,borderRight:"1px solid #1E293B"}}>
                      <span style={{color:"#64748B",fontSize:9,textTransform:"uppercase",letterSpacing:"0.1em"}}>4h Trend</span>
                      <span style={{color:trendColor,fontSize:16,fontWeight:800,fontFamily:"monospace"}}>{trendBull?"↑ Bullish":"↓ Bearish"}</span>
                      <span style={{color:"#334155",fontSize:9}}>{trend4h.date?.slice(0,16)}</span>
                    </div>
                    <span style={{color:barColor,fontSize:13,fontWeight:600,flex:1,minWidth:200}}>{verdict}</span>
                  </div>
                );
              })()}

              {isForexPair(signal.sym)&&<div style={{background:"#0F1E35",border:"1px solid #1E3A5F",borderRadius:7,padding:"8px 12px",marginBottom:12,fontSize:11,color:"#64748B"}}>💡 TP/SL in price units. To pips: difference × {signal.sym.includes("JPY")?"100":"10,000"}.{signal.sym.includes("XAU")?"  Gold moves in USD per troy ounce.":""}</div>}

              <div style={{display:"flex",gap:4,marginBottom:12}}>
                {["chart","backtest","trades"].map(t=>(
                  <button key={t} onClick={()=>setTab(t)} style={{padding:"6px 14px",borderRadius:6,border:"1px solid",borderColor:tab===t?"#1D4ED8":"#1E293B",background:tab===t?"#1E3A5F":"#0F172A",color:tab===t?"#93C5FD":"#64748B",fontSize:12,fontWeight:600,cursor:"pointer"}}>{t==="backtest"?"Backtest":t==="trades"?"Trade Log":"Chart"}</button>
                ))}
              </div>

              {tab==="chart"&&(
                <div style={{background:"#0F172A",border:"1px solid #1E293B",borderRadius:12,padding:"16px 12px 12px"}}>
                  <div style={{color:"#64748B",fontSize:11,marginBottom:8,paddingLeft:4}}>
                    <span style={{color:"#3B82F6",fontWeight:600}}>— EMA 9</span>{"  "}<span style={{color:"#A78BFA",fontWeight:600}}>— EMA 15</span>{"  "}<span style={{color:"#334155"}}>{displaySym(signal.sym)} · {INTERVALS.find(i=>i.key===ivl)?.note}</span>
                  </div>
                  <PriceChart data={chartData} dec={dec} intraday={ivl!=="daily"}/>
                </div>
              )}

              {tab==="backtest"&&backtest&&(
                <div>
                  <div style={{display:"flex",gap:10,marginBottom:12,flexWrap:"wrap"}}>
                    <StatCard label="Trades" value={backtest.total} sub={INTERVALS.find(i=>i.key===ivl)?.note}/>
                    <StatCard label="Win Rate" value={`${backtest.winRate}%`} color={parseFloat(backtest.winRate)>=50?"#10B981":"#EF4444"} sub={`${backtest.wins}W / ${backtest.losses}L`}/>
                    <StatCard label="Net Return" value={fmtPct(backtest.totalRet)} color={parseFloat(backtest.totalRet)>=0?"#10B981":"#EF4444"} sub={`$10k → ${fmtUSD(backtest.finalCapital)}`}/>
                    <StatCard label="Max DD" value={`-${backtest.maxDrawdown}%`} color={backtest.maxDrawdown<10?"#10B981":backtest.maxDrawdown<20?"#F59E0B":"#EF4444"} sub="Drawdown"/>
                    <StatCard label="Avg Win" value={fmtPct(backtest.avgWin)} color="#10B981" sub="Per win"/>
                    <StatCard label="Avg Loss" value={fmtPct(backtest.avgLoss)} color="#EF4444" sub="Per loss"/>
                  </div>
                  <div style={{background:"#0F172A",border:"1px solid #1E293B",borderRadius:10,padding:16,fontSize:13,color:"#94A3B8",lineHeight:1.8}}>
                    <div style={{color:"#E2E8F0",fontWeight:600,marginBottom:8}}>Simulation rules</div>
                    <div>• <strong style={{color:"#3B82F6"}}>Entry:</strong> 9 EMA crosses above 15 EMA → buy at close · 95% capital</div>
                    <div>• <strong style={{color:"#EF4444"}}>Stop Loss:</strong> Entry − 1.5× ATR(14)</div>
                    <div>• <strong style={{color:"#10B981"}}>Take Profit:</strong> Entry + 3× ATR(14) · 1:2 R:R</div>
                    <div>• <strong style={{color:"#A78BFA"}}>Signal Exit:</strong> 9 EMA crosses back below 15 EMA</div>
                    <div style={{marginTop:10,color:"#475569",fontSize:11}}>⚠ Long-only. No spread/swap/slippage modelled. Past performance ≠ future results.</div>
                  </div>
                </div>
              )}

              {tab==="trades"&&backtest&&(
                <div>
                  <div style={{display:"flex",gap:6,marginBottom:10}}>
                    {["ALL","WIN","LOSS"].map(f=>(
                      <button key={f} onClick={()=>setTradeFilter(f)} style={{padding:"4px 10px",borderRadius:5,border:"1px solid",borderColor:tradeFilter===f?"#1D4ED8":"#1E293B",background:tradeFilter===f?"#1E3A5F":"#0F172A",color:tradeFilter===f?"#93C5FD":"#64748B",fontSize:11,fontWeight:600,cursor:"pointer"}}>{f==="WIN"?"✓ Wins":f==="LOSS"?"✗ Losses":"All"}</button>
                    ))}
                    <span style={{color:"#475569",fontSize:12,lineHeight:"26px"}}>{filtered.length} trades</span>
                  </div>
                  <div style={{background:"#0F172A",border:"1px solid #1E293B",borderRadius:10,overflow:"auto"}}>
                    <table style={{width:"100%",borderCollapse:"collapse",fontSize:11}}>
                      <thead><tr style={{borderBottom:"1px solid #1E293B"}}>
                        {["#","Entry Date","Exit Date","Entry","Exit","TP","SL","P&L","%","Result","Exit Reason"].map(h=>(
                          <th key={h} style={{padding:"8px 10px",textAlign:"left",color:"#475569",fontWeight:600,whiteSpace:"nowrap"}}>{h}</th>
                        ))}
                      </tr></thead>
                      <tbody>
                        {filtered.length===0?<tr><td colSpan={11} style={{padding:20,color:"#475569",textAlign:"center"}}>No trades</td></tr>
                        :filtered.map(t=>(
                          <tr key={t.id} style={{borderBottom:"1px solid #0D1525"}}>
                            <td style={{padding:"7px 10px",color:"#475569",fontFamily:"monospace"}}>{t.id}</td>
                            <td style={{padding:"7px 10px",color:"#64748B",fontFamily:"monospace",whiteSpace:"nowrap"}}>{t.entryDate?.slice(0,10)}</td>
                            <td style={{padding:"7px 10px",color:"#64748B",fontFamily:"monospace",whiteSpace:"nowrap"}}>{t.exitDate?.slice(0,10)}</td>
                            <td style={{padding:"7px 10px",color:"#E2E8F0",fontFamily:"monospace"}}>{fmt(t.entry,dec)}</td>
                            <td style={{padding:"7px 10px",color:"#E2E8F0",fontFamily:"monospace"}}>{fmt(t.exit,dec)}</td>
                            <td style={{padding:"7px 10px",color:"#10B981",fontFamily:"monospace"}}>{fmt(t.tp,dec)}</td>
                            <td style={{padding:"7px 10px",color:"#EF4444",fontFamily:"monospace"}}>{fmt(t.sl,dec)}</td>
                            <td style={{padding:"7px 10px",fontFamily:"monospace",fontWeight:600,color:t.pnl>=0?"#10B981":"#EF4444"}}>{t.pnl>=0?"+":""}{fmtUSD(t.pnl)}</td>
                            <td style={{padding:"7px 10px",fontFamily:"monospace",color:t.pnlPct>=0?"#10B981":"#EF4444"}}>{fmtPct(t.pnlPct)}</td>
                            <td style={{padding:"7px 10px"}}><span style={{padding:"2px 6px",borderRadius:4,fontSize:10,fontWeight:700,background:t.result==="WIN"?"#052E16":"#450A0A",color:t.result==="WIN"?"#10B981":"#EF4444"}}>{t.result}</span></td>
                            <td style={{padding:"7px 10px",color:"#475569",whiteSpace:"nowrap"}}>{t.reason}</td>
                          </tr>
                        ))}
                      </tbody>
                    </table>
                  </div>
                </div>
              )}
            </React.Fragment>
          )}
        </div>
      </div>
    </div>
  );
}

ReactDOM.createRoot(document.getElementById("root")).render(<EMATrader/>);
</script>
</body>
</html>
